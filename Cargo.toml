[package]
name = "flood_monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.11.8"
log = "0.4.29"
serialport = { version = "4.7.3", default-features = false }
serde_json = "1.0.148"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17.14"
nix = { version = "0.26.4", default-features = false, features = ["fs"] }
hyper = { version = "0.14.32", features = ["server", "http1", "tcp"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "net"] }
